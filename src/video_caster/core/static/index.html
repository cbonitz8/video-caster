<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caster">
<meta name="theme-color" content="#12120c">
<title>Video Caster</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&family=DotGothic16&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/app.js"></script>
</head>
<body class="mga">
<header class="mga-statusbar top">
  <span aria-hidden="true">◇</span>
  <h1 class="mga-statusbar__title">Video Caster</h1>
  <button id="device-chip" class="mga-statusbar__button" type="button">…</button>
</header>
<div id="strip" class="strip" hidden>Reconnecting…</div>
<main>
  <section id="library-tab"></section>
  <section id="remote-tab" hidden></section>
</main>
<div id="nowbar" class="nowbar" hidden></div>
<nav class="mga-labelbar tabbar">
  <button class="mga-labelbar__tab" type="button" data-tab="library">Library</button>
  <button class="mga-labelbar__tab" type="button" data-tab="remote">Remote</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="sheet-layer" class="sheet-layer" hidden></div>
</body>
</html>
