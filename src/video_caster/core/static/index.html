<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caster">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Video Caster</title>
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="top">
  <h1>Video Caster</h1>
  <button id="device-chip" class="chip" type="button">…</button>
</header>
<div id="strip" class="strip" hidden>Reconnecting…</div>
<main>
  <section id="library-tab"></section>
  <section id="remote-tab" hidden></section>
</main>
<div id="nowbar" class="nowbar" hidden></div>
<nav class="tabbar">
  <button type="button" data-tab="library">Library</button>
  <button type="button" data-tab="remote">Remote</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="sheet-layer" class="sheet-layer" hidden></div>
</body>
</html>
